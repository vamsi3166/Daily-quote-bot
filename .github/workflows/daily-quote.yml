name: Daily Motivational Quote

on:
  schedule:
    - cron: "0 7 * * *"  # 7:00 AM UTC every day — adjust for your timezone
  workflow_dispatch:      # lets you trigger it manually from the Actions tab, for testing

jobs:
  send-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Send quote to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_quote_bot.py
